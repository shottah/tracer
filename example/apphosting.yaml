# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure
#
# Next.js (App Router) inspector that shells out to the `tracer` Rust binary
# (downloaded at build by scripts/fetch-tracer.mjs, bundled via
# outputFileTracingIncludes). Built with Cloud Build buildpacks (npm), served
# on Cloud Run.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 1024

env:
  # No anvil on serverless -> force the rpc backend.
  - variable: TRACER_BACKEND
    value: rpc
    availability:
      - RUNTIME

  # dRPC key covering every supported chain (see lib/chains.ts). Secret:
  #   firebase apphosting:secrets:set DRPC_API_KEY
  # For a single chain, swap this for an ETH_RPC_URL secret instead.
  - variable: DRPC_API_KEY
    secret: DRPC_API_KEY
    availability:
      - RUNTIME

  # GA4 measurement ID (public, not a secret). NEXT_PUBLIC_* is inlined into
  # the client bundle at build time, so BUILD availability is required.
  - variable: NEXT_PUBLIC_GA_ID
    value: G-HJS4EZSXX3
    availability:
      - BUILD
      - RUNTIME
